name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Existing tag to publish (must be v0.0.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.releaseTag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm run verify:release

      - name: Ensure tag matches package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${{ inputs.releaseTag }}"

      - name: Publish package
        run: npm publish
